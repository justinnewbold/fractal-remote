<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Safari on an iPhone offers the App Store app in a banner it draws itself;
         nothing else reads this, and the banner can be closed. -->
    <meta name="apple-itunes-app" content="app-id=6812916461" />
    <title>Fractal Remote</title>
    <!-- Add to home screen: an icon and a fullscreen launch, with no app store
         between a player and the thing. The phone half of this app is a
         browser by design — see scripts/serve.mjs. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- No font links: the fonts are the app's own files (src/fonts.css,
         public/fonts), so opening it, in a browser, in the computer app's
         window or from the computer on the same Wi-Fi, asks no one else for
         anything, and works with no internet. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
