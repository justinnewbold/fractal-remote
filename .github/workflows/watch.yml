# Check the Apple Watch app — for free, before any Expo build is spent on it.
#
# An iOS build slot is the one thing in this project that does not come back,
# and the watch app is written in Swift, which nothing on a Linux box can
# compile. So this job does on a GitHub Mac what an EAS build would otherwise
# be the first to find out:
#
#   1. the watch's reading of what the phone sends (mobile/watch-ci, swift test,
#      against JSON the phone's own code wrote — test/run.mjs keeps it so);
#   2. the whole watch app builds for a simulated watch;
#   3. a picture of each page from that simulated watch, in demo mode, kept as
#      the "watch-screens" artifact so the layout can be looked at;
#   4. (the `iphone` job) the whole iPhone app, generated the way EAS generates
#      it, with the watch app inside and the phone's half of the link
#      (mobile/modules/fractal-watch), built for the simulator. Everything an
#      EAS build would do except sign it.
#
# The watch app on its own here (mobile/watch-ci/project.yml); in the shipping
# build the same files go into the iPhone app's project.
name: watch

on:
  pull_request:
    paths:
      - 'mobile/targets/watch/**'
      - 'mobile/watch-ci/**'
      - 'mobile/modules/**'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'shared/watch-link.mjs'
      - '.github/workflows/watch.yml'
  workflow_dispatch:

jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Which Xcode
        run: xcodebuild -version

      - name: The watch reads what the phone sends
        working-directory: mobile/watch-ci
        run: swift test

      - name: Make the watch project
        working-directory: mobile/watch-ci
        run: |
          brew install xcodegen
          xcodegen generate

      - name: The watch app builds
        working-directory: mobile/watch-ci
        run: |
          set -o pipefail
          xcodebuild -project FractalWatchCI.xcodeproj -scheme FractalWatch \
            -sdk watchsimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: A picture of each page
        run: bash mobile/watch-ci/screens.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screens
          path: mobile/watch-ci/screens
          if-no-files-found: ignore

  iphone:
    # The newest Mac image: this Expo SDK's own native pieces (ExpoModulesJSI)
    # do not build with the Xcode 16 the macos-15 image defaults to, and EAS
    # builds with the newest Xcode too.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Which Xcode
        run: xcodebuild -version

      - name: The iPhone project, with the watch app in it
        working-directory: mobile
        run: npx expo prebuild -p ios --no-install

      - name: The watch app is in it
        working-directory: mobile/ios
        run: |
          grep -q 'cloud.newbold.fractalremote.watchkitapp' *.xcodeproj/project.pbxproj
          grep -q 'Embed Watch Content' *.xcodeproj/project.pbxproj

      - name: Pods
        working-directory: mobile/ios
        run: pod install

      # A destination and no -sdk: an -sdk applies to every target, and the
      # watch app built against the iPhone's SDK is not a watch app at all.
      - name: The iPhone app and the watch app build
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FractalRemote.xcworkspace -scheme FractalRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -B2 -A12 -E 'error:|error |failed with exit' build.log | head -n 200; exit 1; }
          tail -n 20 build.log
