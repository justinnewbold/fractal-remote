# Check the Apple Watch app — for free, before any Expo build is spent on it.
#
# An iOS build slot is the one thing in this project that does not come back,
# and the watch app is written in Swift, which nothing on a Linux box can
# compile. So this job does on a GitHub Mac what an EAS build would otherwise
# be the first to find out:
#
#   1. the watch's reading of what the phone sends (mobile/watch-ci, swift test,
#      against JSON the phone's own code wrote — test/run.mjs keeps it so);
#   2. the whole watch app builds for a simulated watch;
#   3. a picture of each page from that simulated watch, in demo mode, kept as
#      the "watch-screens" artifact so the layout can be looked at;
#   4. (the `iphone` job) the whole iPhone app, generated the way EAS generates
#      it, with the watch app inside and the phone's half of the link
#      (mobile/modules/fractal-watch), built for the simulator. Everything an
#      EAS build would do except sign it.
#
# The watch app on its own here (mobile/watch-ci/project.yml); in the shipping
# build the same files go into the iPhone app's project.
name: watch

on:
  pull_request:
    paths:
      - 'mobile/targets/watch/**'
      - 'mobile/watch-ci/**'
      - 'mobile/modules/**'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'shared/watch-link.mjs'
      - '.github/workflows/watch.yml'
  workflow_dispatch:

jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 40
    # Write only for the Releases page below, which only a manual run uses.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Which Xcode
        run: xcodebuild -version

      - name: The watch reads what the phone sends
        working-directory: mobile/watch-ci
        run: swift test

      - name: Make the watch project
        working-directory: mobile/watch-ci
        run: |
          brew install xcodegen
          xcodegen generate

      - name: The watch app builds
        working-directory: mobile/watch-ci
        run: |
          set -o pipefail
          xcodebuild -project FractalWatchCI.xcodeproj -scheme FractalWatch \
            -sdk watchsimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: A picture of each page
        run: bash mobile/watch-ci/screens.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screens
          path: mobile/watch-ci/screens
          if-no-files-found: ignore
          # Screenshots for looking at a pull request, not for keeping: three days
          # instead of 90.
          retention-days: 3

      # THE APP STORE'S APPLE WATCH SCREENSHOTS. A listing whose build carries
      # a watch app must have at least one, and these are the right size as
      # they come: a 46mm watch simulator, full resolution. Artifacts can only
      # be fetched when signed in to GitHub, so a manual run also puts them on
      # the Releases page, where a plain link downloads them.
      - name: The watch screenshots, for App Store Connect
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd mobile/watch-ci/screens
          sips -g pixelWidth -g pixelHeight page-0.png
          # JPEG, which carries no transparency: App Store Connect refuses a
          # screenshot with an alpha channel, and the simulator's PNGs have one.
          for f in page-0 page-1 page-2 page-3 tuner-on; do sips -s format jpeg -s formatOptions 95 "$f.png" --out "watch-$f.jpg" >/dev/null; done
          if ! gh release view watch-screenshots >/dev/null 2>&1; then
            gh release create watch-screenshots --title "Apple Watch screenshots (App Store)" \
              --notes "For App Store Connect, under the version's Apple Watch screenshots. Taken from the watch app in demo mode." \
              --prerelease --latest=false
          fi
          gh release upload watch-screenshots watch-page-*.jpg watch-tuner-on.jpg --clobber
          for f in watch-page-0 watch-page-1 watch-page-2 watch-page-3 watch-tuner-on; do
            echo "https://github.com/${{ github.repository }}/releases/download/watch-screenshots/$f.jpg" >> "$GITHUB_STEP_SUMMARY"
          done

  iphone:
    # The newest Mac image: this Expo SDK's own native pieces (ExpoModulesJSI)
    # do not build with the Xcode 16 the macos-15 image defaults to, and EAS
    # builds with the newest Xcode too.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Which Xcode
        run: xcodebuild -version

      - name: The iPhone project, with the watch app in it
        working-directory: mobile
        run: npx expo prebuild -p ios --no-install

      - name: The watch app is in it
        working-directory: mobile/ios
        run: |
          grep -q 'cloud.newbold.fractalremote.watchkitapp' *.xcodeproj/project.pbxproj
          grep -q 'Embed Watch Content' *.xcodeproj/project.pbxproj

      - name: Pods
        working-directory: mobile/ios
        run: pod install

      # A destination and no -sdk: an -sdk applies to every target, and the
      # watch app built against the iPhone's SDK is not a watch app at all.
      - name: The iPhone app and the watch app build
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FractalRemote.xcworkspace -scheme FractalRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -B2 -A12 -E 'error:|error |failed with exit' build.log | head -n 200; exit 1; }
          tail -n 20 build.log

      # The same app for a real iPhone, unsigned. Came in with Bluetooth (beta).
      # The simulator build above cannot see a framework that is only on
      # devices (CoreAudioKit's Bluetooth pairing screen is guarded out of the
      # simulator), so this is the free proof that the device build links,
      # before an EAS build slot is spent finding out.
      - name: The iPhone app builds for a real device
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FractalRemote.xcworkspace -scheme FractalRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > device.log 2>&1 \
            || { grep -n -B2 -A12 -E 'error:|error |failed with exit' device.log | head -n 200; exit 1; }
          tail -n 20 device.log
