# Build the desktop apps.
#
# TWO JOBS, ONE APP. macOS binaries need a macOS runner and Windows ones need a
# Windows runner — the app carries native modules (serial, MIDI) that are
# compiled per platform, so neither can be cross-built from the other.
#
# Everything above the runner is shared: the same main.js, the same vendored
# device server at the same pinned commit, the same update channel. What
# differs is the installer, the tray icon and the certificate. See the `win`
# block in desktop/electron-builder.yml for the whole of it.
#
# The device server is no longer checked out beside the app and then thrown
# away — scripts/vendor-forgefx.mjs fetches it at the pinned commit and builds
# it into desktop/vendor, which electron-builder copies into the bundle. That
# is the difference between a .dmg that works on the machine that built it and
# one that works on someone else's.
#
# Signing and notarisation happen whenever there is a certificate to sign with
# and the run is not a pull request. Those are the two real constraints, and it
# is worth saying why the second one is not "only on a release tag":
# electron-builder refuses to sign PR builds by design, because a pull request
# from a fork would otherwise get at the certificate. Everything else — a tag, a
# push, a hand-started run — can sign, and should, because an artefact someone
# installs is worth signing whether or not it was called a release.
#
# Without the secrets this still builds, and macOS then reports an unidentified
# developer on first launch.
#
# APPLE'S APPROVAL STOPS A RELEASE; APPLE'S STAMP NEVER DOES. Notarising (Apple
# checking the signed app and saying yes) happens on every Mac release and a
# no fails the build. Stapling (pinning that yes to the file) is asked for
# patiently and is allowed to be missing, because from 1.87.14 on Apple's
# ticket service kept dropping the line to GitHub's Mac machines — and on
# 1.87.21 that took the Mac files off the release altogether. A Mac opening an
# app with no stamp asks Apple itself, and shows the same single prompt; see
# desktop/notarise.js for the whole of it.
name: desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release from this build'
        type: boolean
        default: false
  # AND ON MAIN, SO THE MAC APP FOLLOWS THE OTHERS.
  #
  # "When you make an update on phone versions, they need to make it on the
  # web version and Mac app as well, which I think that those are running the
  # same web app versions anyways."
  #
  # Same code, and not the same copy. The browser gets the new bundle from
  # Vercel the moment main moves, and the phone gets an over-the-air update
  # now that the APK can take one. The Mac app serves `dist/` from INSIDE the
  # packaged app — `process.resourcesPath/dist` in desktop/main.js — so it
  # carries whatever web app it was built with and nothing reaches it until
  # somebody publishes a new one.
  #
  # Nobody had. This built on pull requests and on a `desktop-v*` tag, and
  # published only from a tag or a ticked box, so the last release went out at
  # 7.372.0 and every change since has been invisible on that machine while
  # being live everywhere else.
  #
  # It costs no quota — ordinary runners and Apple's notary service, the same
  # as the APK's free build — and electron-updater does the rest: the app
  # checks the release feed on launch and installs what it finds.
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/vendor-forgefx.mjs'
      - '.github/workflows/desktop.yml'

jobs:
  # ------------------------------------------------------------------ release
  #
  # ONE RELEASE, MADE ONCE, BEFORE ANYTHING TRIES TO UPLOAD INTO IT.
  #
  # electron-builder's GitHub publisher looks for a release with this version's
  # tag and creates one when it finds none. Four jobs reach that check within
  # the same second — mac, windows and the two Linux architectures — so all
  # four find nothing and all four try to create it. One wins. The others are
  # told 422 already_exists and give up, taking their own uploads down with
  # them.
  #
  # That is not theoretical. It is what happened to 1.14.0: the x64 Linux build
  # succeeded, failed on its last step, and that platform got no download and
  # no latest-linux.yml — so nothing on Intel Linux could install or update to
  # it, while every other platform looked fine.
  #
  # Making the release first closes the window. The four builds then find an
  # existing release and upload into it, which is the path electron-builder
  # takes every time after the first anyway.
  #
  # IT ONLY RUNS WHEN SOMETHING IS ACTUALLY BEING PUBLISHED. A pull request
  # builds without publishing, so there is no release to make and this is
  # skipped — which is why every job below says `always()` as well as naming
  # this one. A skipped dependency otherwise skips everything that needs it,
  # and that would turn off the desktop build on every pull request.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || ((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The release exists before anything uploads to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./desktop/package.json').version")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already there; nothing to make."
          else
            # Same shape electron-builder would have made: published, not a
            # draft, on the commit being built. Notes are left empty because
            # the release body is not what anybody reads — the assets are.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "${tag#v}" \
              --notes ""
            echo "made $tag"
          fi

  mac:
    # Pinned, and this is a stopgap rather than a fix.
    #
    # GitHub rolled macos-latest from image 20260728.0273.1 to 20260831.0337.3
    # between two builds three hours apart. The first signed and published
    # 7.31.0; the next two failed identically inside electron-builder's
    # keychain step:
    #
    #   security: SecKeychainUnlock: The user name or passphrase you entered
    #   is not correct.
    #
    # No secret changed and no code in the signing path changed — the machine
    # underneath did. Pinning puts releases back on a machine known to work
    # while electron-builder is brought up to a version that handles the new
    # image; the real fix is that upgrade, and this line goes when it lands.
    runs-on: macos-15
    needs: release
    # `always()` because `release` is skipped on a pull request, and a skipped
    # dependency skips its dependents unless they say otherwise. The second
    # half keeps the old behaviour where it matters: if making the release
    # fails, nothing tries to publish into a release that is not there.
    if: ${{ always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' }}
    # Creating a release needs contents: write, and a workflow that says
    # nothing gets whatever the repository defaults to — which here is read
    # only. GitHub named the missing permission itself when it refused:
    #
    #   403 Resource not accessible by integration
    #   x-accepted-github-permissions: contents=write
    #
    # Asked for by name rather than left to a default, so this cannot quietly
    # change underneath the release again. Nothing else is granted: the job
    # reads the repository, builds it, and publishes what it built.
    permissions:
      contents: write
    env:
      # Whether a certificate exists at all. The `secrets` context cannot be
      # read from a step's `if`, but `env` can, so the question is answered once
      # here and asked by name below.
      SIGNABLE: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      # Pinned by desktop/forgefx.lock.json: a tag to read, a commit to fetch.
      # FORGEFX_TOKEN is required — the mirrors it reads are private. Without it
      # the script stops and says so by name rather than failing on git's own
      # "could not read Username", which sends people looking anywhere but here.
      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The question this answers cannot be answered anywhere but here: the
      # server's native modules are built against system Node, and the app runs
      # them under Electron-as-Node, whose ABI differs. N-API modules do not
      # care; anything else does, and the symptom would be an app that opens
      # perfectly and never sees the unit. Better a red build than that.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # Two steps rather than one, and the reason is worth writing down.
      #
      # electron-builder decides whether to sign from whether CSC_LINK is
      # *defined*: `getCscLink` is commented "allow to specify as empty string",
      # and the gate is `cscLink == null`. GitHub turns a secret that does not
      # exist into an empty string — which is not null — so naming the secret in
      # `env:` says "sign, with this empty certificate", and the build dies with
      # "<dir> not a file". A pull request hides it, because electron-builder
      # refuses to sign PR builds at all; every other trigger hits it.
      #
      # An `env:` block cannot leave a variable unset, so the choice has to be
      # which step runs.
      - name: Package
        if: ${{ github.event_name == 'pull_request' || env.SIGNABLE != 'true' }}
        working-directory: desktop
        env:
          # Nothing to sign with, and say so rather than letting it look.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Package, signed and notarised
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          # Published only from a release tag. Every other run builds the same
          # artefact and keeps it, so a dispatch can prove the signing chain
          # without putting a version on the update feed that nobody asked for.
          # Two ways to say "release this", and one of them is a button.
          #
          # A tag was the only way, and pushing one is not always available —
          # a credential scoped to a branch is refused with a 403, and there is
          # nothing to retry. It was never required either: electron-builder
          # creates the release through GitHub's API and GitHub makes the tag,
          # so the tag is a *result* of releasing rather than the trigger for
          # it. The run that publishes is the record of what was released.
          #
          # Only ever from the default branch. `createRelease` does not send a
          # commit to tag, so GitHub tags the default branch's head — a release
          # published from anywhere else would carry that name and someone
          # else's code.
          #
          # NOTARISED BY desktop/notarise.js, not by electron-builder itself
          # (`notarize: false` and `afterSign: notarise.js` in
          # electron-builder.yml). The Apple ID below is what it signs in to
          # Apple with. It sends each .app to Apple after signing and before
          # the zip and the disk image are made, and a refusal fails this
          # step before anything is published, exactly as before. What it no
          # longer does is fail this step when Apple's ticket service cannot
          # be reached for the stamp afterwards: on 1.87.21 electron-builder's
          # own staple threw here, after Apple had said Accepted, and no Mac
          # files reached the release at all.
          PUBLISH: >-
            ${{ (startsWith(github.ref, 'refs/tags/desktop-v')
                 || (((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main')))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      # The app inside is notarised during packaging (notarise.js, as
      # electron-builder's afterSign hook) — before a disk image exists at
      # all. So the image gets its own trip to Apple here.
      #
      # Through the same notarise.js, and so by the same rules: a refusal from
      # Apple fails this step (it reads notarytool's answer and believes only
      # Accepted — a bare `notarytool submit --wait` was trusted to fail on
      # its own here before), and a stamp Apple's ticket service will not
      # hand over is a warning. That stamp only ever reached the copy kept
      # with this run, in any case: electron-builder uploads each file to the
      # release the moment it is made, so the image on the release is the one
      # it made. Notarising it still counts — a Mac that opens it asks Apple,
      # and Apple knows it.
      #
      # Deliberately not signed. electron-builder offers `dmg.sign` and
      # documents it as "Signing is not required and will lead to unwanted
      # errors in combination with notarization requirements" — the notary
      # service reads what is inside the image, and the ticket attaches either
      # way. Taking the tool's own word over a guess.
      - name: Notarise the disk image too
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "── $dmg"
            node notarise.js "$dmg"
          done

      # What the steps above claim, checked against what macOS will actually do
      # with the file. Three different questions, and a build can pass one while
      # failing another:
      #
      #   codesign --verify   is the signature intact, and does it cover
      #                       everything inside — the vendored server's native
      #                       modules included
      #   stapler validate    is the stamp on the file, so it opens with no
      #                       network at all
      #   spctl --assess      would Gatekeeper let a person open this — and it
      #                       says yes to a Developer ID app only once Apple
      #                       has notarised it: "accepted, source=Notarized
      #                       Developer ID". This is the proof of approval.
      #
      # The signature fails the run, always. A missing stamp is a warning,
      # because the stamp comes from the ticket service that dropped the line
      # on every Mac run from 1.87.14 to 1.87.22, and because it changes
      # nothing for anybody with internet: macOS looks the approval up with
      # Apple on the first open and shows the same single prompt. Justin:
      # "Right now users just have to click the button about being from an
      # unknown developer and that's all to install. Just wanna make sure
      # that's not gonna change."
      #
      # And the proof of approval depends on the stamp, because Gatekeeper's
      # answer does:
      #
      #   - Stamped: spctl answers from the file, on this machine, and its no
      #     fails the run, as it always has.
      #   - Not stamped: spctl has to ask Apple online, through the SAME ticket
      #     service that would not hand the stamp over — and a lookup that
      #     drops the line comes back "rejected, source=Unnotarized Developer
      #     ID", exactly like a real no. So when it still says no after five
      #     tries, the proof is asked of Apple's notary instead (notarise.js
      #     --confirm: `notarytool info` on the submission written down when
      #     Apple accepted the file, which has answered on every run). Accepted
      #     there is a warning; anything else, or no record at all, fails the
      #     run. Without that, a release whose stamp could not be fetched went
      #     red here after it had gone out, for a lookup and not for a no.
      #
      # On a run that publishes, the files are already on the release by the
      # time this runs (electron-builder uploads as it goes), so nothing here
      # can hold a release back either way: a red here says the one that just
      # went out needs looking at. An app Apple refused never gets this far:
      # notarise.js fails the package step before anything is published.
      - name: Prove the artefact is what it claims
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          # For notarise.js --confirm, which asks Apple's notary about a file
          # with no stamp.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Globs rather than `find | for`: the product name has spaces in it.
          shopt -s nullglob
          # Patience for Gatekeeper's question, which asks Apple online when
          # there is no stamp. A real "no" fails all five tries.
          again() {
            for wait in 0 10 20 40 80; do
              sleep "$wait"
              "$@" && return 0
              echo "::warning::$* did not answer; asking again"
            done
            return 1
          }
          nostamp() {
            echo "::warning::$1 is notarised but carries no stamp; a Mac opening it looks the approval up with Apple, and shows the same prompt"
          }

          seen=0
          for app in release/mac*/*.app; do
            seen=1
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            if xcrun stapler validate "$app"; then
              # Stamped: Gatekeeper answers from the file, and a no is a no.
              again spctl --assess --type exec --verbose=4 "$app"
            else
              if ! again spctl --assess --type exec --verbose=4 "$app"; then
                # No stamp, and Gatekeeper's lookup did not get through: Apple's notary decides.
                node notarise.js --confirm "$app"
              fi
              nostamp "$app"
            fi
          done
          [ "$seen" = 1 ] || { echo "no .app was produced to check"; exit 1; }

          # The disk image gets no Gatekeeper question and no signature check.
          # `codesign --verify` was asked of it once and cannot ever pass: a
          # .dmg is a disk image, not a code object, and the first build to
          # reach this said so — "code object is not signed at all" — while
          # the app inside it had already come back "accepted,
          # source=Notarized Developer ID". Stamped, it is proven; not
          # stamped, Apple's notary is asked about it, as for the app.
          seen=0
          for dmg in release/*.dmg; do
            seen=1
            echo "── $dmg"
            if ! xcrun stapler validate "$dmg"; then
              node notarise.js --confirm "$dmg"
              nostamp "$dmg"
            fi
          done
          [ "$seen" = 1 ] || { echo "no .dmg was produced to check"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-remote-mac
          path: desktop/release/*.dmg
          if-no-files-found: error
          # The finished installers are on the Releases page; this copy is only for
          # fetching a build by hand, so it goes after three days instead of 90.
          retention-days: 3

  # ------------------------------------------------------------------ windows
  #
  # The same app on a Windows runner. It cannot be built on the Mac one: the
  # device server's native modules are compiled for the platform they run on,
  # which is the whole reason there are two jobs rather than two targets in one.
  #
  # UNSIGNED UNLESS THERE IS A CERTIFICATE, and the difference is visible to
  # whoever downloads it. An unsigned installer runs, and SmartScreen puts
  # "Windows protected your PC" in front of it with a More info → Run anyway
  # behind that. Nothing here can remove that warning: a Windows code-signing
  # certificate is bought rather than generated. WIN_CERT_P12 and
  # WIN_CERT_PASSWORD are read the moment they exist, and nothing else changes.
  windows:
    runs-on: windows-latest
    needs: release
    # `always()` because `release` is skipped on a pull request, and a skipped
    # dependency skips its dependents unless they say otherwise. The second
    # half keeps the old behaviour where it matters: if making the release
    # fails, nothing tries to publish into a release that is not there.
    if: ${{ always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' }}
    permissions:
      contents: write
    env:
      SIGNABLE: ${{ secrets.WIN_CERT_P12 != '' }}
    # bash on the Windows runner, for every step that runs a command: the
    # heredoc below, the loops over release/, and `${PUBLISH:-never}` in the
    # Package steps.
    #
    # THAT LAST ONE USED TO LIVE IN THE DIST SCRIPT, and this is the shape of
    # the bug it caused, because it is not the one it looks like. `shell: bash`
    # governs the step's own command and nothing further: npm runs a script's
    # BODY through its own shell, which on Windows is cmd.exe whatever the
    # workflow asked for. So `--publish ${PUBLISH:-never}` inside the script
    # reached electron-builder verbatim and it failed with
    #   Argument: publish, Given: "${PUBLISH:-never}"
    # — a message that names the right argument and gives no hint that a shell
    # is involved at all.
    #
    # dist:win carries no shell syntax now. The expansion happens here, where
    # bash is real, and npm is handed a word.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The same question the Mac job asks, and it is worth asking twice: the
      # modules are built against the runner's Node and loaded under Electron's,
      # whose ABI differs. N-API modules do not care; anything else does, and
      # the symptom would be an app that opens perfectly and never sees the
      # unit.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # UNSIGNED WINDOWS BUILDS STILL PUBLISH, and that is the one place this
      # job deliberately differs from the Mac one above.
      #
      # An unsigned macOS app is not worth releasing: Gatekeeper refuses it
      # outright and the person who downloaded it has no way through that a
      # normal person would find. Windows is not like that. SmartScreen shows
      # a blue "Windows protected your PC" box with More info -> Run anyway
      # underneath it, and the installer then works exactly as a signed one
      # would. Holding the Windows release back until a certificate exists
      # would mean no Windows app at all, for a warning the connect screen
      # already tells people to expect.
      #
      # A certificate is still worth buying — it is the difference between
      # "Run anyway" and no box at all — but it is not what stands between a
      # PC and this app.
      - name: Package
        if: ${{ github.event_name == 'pull_request' || env.SIGNABLE != 'true' }}
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (github.event_name != 'pull_request'
                 && (startsWith(github.ref, 'refs/tags/desktop-v')
                     || (((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main'))))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish "${PUBLISH:-never}"

      - name: Package, signed
        if: ${{ github.event_name != 'pull_request' && env.SIGNABLE == 'true' }}
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (startsWith(github.ref, 'refs/tags/desktop-v')
                 || (((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main')))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npm run dist:win -- --publish "${PUBLISH:-never}"

      # An installer and the zip beside it. The zip is not for people: it is
      # what electron-updater downloads, exactly as on macOS, and without it
      # the app finds a release it can never install.
      - name: Both halves of a release are there
        working-directory: desktop
        run: |
          ls -la release/
          seen=0
          for exe in release/*.exe; do [ -e "$exe" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no installer was produced"; exit 1; }
          seen=0
          for z in release/*.zip; do [ -e "$z" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no zip was produced, so nothing can update itself"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-remote-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          # The finished installers are on the Releases page; this copy is only for
          # fetching a build by hand, so it goes after three days instead of 90.
          retention-days: 3

  # ----------------------------------------------------------------- linux
  #
  # TWO ARCHITECTURES, EACH BUILT ON ITS OWN, which is the one decision in
  # this job that is not cosmetic. serialport and @julusian/midi are compiled
  # against the machine that installs them, so an x64 runner cross-building an
  # arm64 package produces an installer whose device layer cannot load — it
  # installs perfectly and never sees the unit. Each runner builds for itself
  # and claims nothing about the other.
  #
  # The arm64 half is what makes a Raspberry Pi a real answer rather than a
  # suggestion: a Pi in a rack with a USB cable in it, left on, is the closest
  # thing to a purpose-built box this project has. `ubuntu-24.04-arm` runners
  # are free on a public repository, which this one is.
  #
  # UNSIGNED, AND THAT IS NORMAL HERE. Linux has no Gatekeeper and no
  # SmartScreen; an AppImage is made executable and run. There is nothing to
  # buy and nothing to warn anybody about, so unlike the other two platforms
  # this job has no signed variant at all.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: release
    # `always()` because `release` is skipped on a pull request, and a skipped
    # dependency skips its dependents unless they say otherwise. The second
    # half keeps the old behaviour where it matters: if making the release
    # fails, nothing tries to publish into a release that is not there.
    if: ${{ always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The web app, and the logic the launchers share
        run: |
          npm ci
          npm test
          npm run build

      - name: Vendor the device server
        env:
          FORGEFX_TOKEN: ${{ secrets.FORGEFX_TOKEN }}
        run: npm run vendor:forgefx

      - name: Install the shell
        working-directory: desktop
        run: npm install

      # The same question the other two jobs ask, and on this one it carries
      # the extra weight of proving the arm64 half is real: a module built for
      # the wrong architecture fails here rather than on somebody's Pi.
      - name: The native modules load under Electron
        working-directory: desktop/vendor/forgefx/server
        run: |
          ELECTRON="$(cd "$GITHUB_WORKSPACE/desktop" && node -p 'require("electron")')"
          echo "electron: $ELECTRON  arch: $(uname -m)"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "
            require('serialport');
            require('@julusian/midi');
            console.log('serial and MIDI both load under Electron-as-Node');
          "

      # ON ARM ONLY, AND THE REASON IS A BINARY THAT DOES NOT EXIST.
      #
      # electron-builder does not build a .deb itself — it downloads fpm and
      # shells out to it. The copy it downloads is `fpm-1.9.3-2.3.1-linux-x86`,
      # and that is the only one published: there is no arm64 build of it. So
      # on this runner the AppImage finishes perfectly, the .deb starts, and
      # the Ruby inside that bundle dies with
      #
      #   cannot execute binary file: Exec format error
      #
      # which reads like a corrupt download and is in fact a 32-bit x86
      # interpreter being handed to an arm64 kernel.
      #
      # fpm is a Ruby gem, and a gem is architecture-neutral. Installing it
      # and setting USE_SYSTEM_FPM makes app-builder run `fpm` off PATH and
      # download nothing — verified by running app-builder that way against an
      # empty cache and watching a valid .deb come out with no fetch.
      #
      # The x64 job deliberately does NOT do this. Its bundled fpm works, and
      # a gem install it does not need is one more thing between that build
      # and a release.
      #
      # WHICH IS WHY THE FLAG IS EXPORTED HERE RATHER THAN SET ON `Package`
      # WITH A CONDITIONAL VALUE. app-builder tests whether USE_SYSTEM_FPM is
      # PRESENT, not what it says, so `USE_SYSTEM_FPM: ${{ ... || '' }}` —
      # which is the obvious way to write "arm only" — hands x64 an empty
      # string that still means yes, and that job then looks for an fpm nobody
      # installed. Tested: with the variable set to empty and fpm off PATH,
      # app-builder skips its own copy and fails with "executable file not
      # found in $PATH". Exporting it from this step means the variable simply
      # does not exist on x64, and the install and the switch stay in one
      # place where they cannot disagree.
      - name: A packager that runs on this machine
        if: matrix.arch == 'arm64'
        run: |
          if ! command -v ruby >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ruby ruby-dev build-essential
          fi
          sudo gem install --no-document fpm
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Package
        working-directory: desktop
        env:
          PUBLISH: >-
            ${{ (github.event_name != 'pull_request'
                 && (startsWith(github.ref, 'refs/tags/desktop-v')
                     || (((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main'))))
                && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux -- --publish "${PUBLISH:-never}"

      # The AppImage is the one that can update itself, so a release without
      # one leaves every installed copy stranded. The .deb is the one people
      # on a Pi or a Debian box will actually reach for. Both or neither.
      - name: Both halves of a release are there
        working-directory: desktop
        run: |
          ls -la release/
          seen=0
          for f in release/*.AppImage; do [ -e "$f" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no AppImage was produced, so nothing can update itself"; exit 1; }
          seen=0
          for f in release/*.deb; do [ -e "$f" ] && seen=1; done
          [ "$seen" = 1 ] || { echo "no .deb was produced"; exit 1; }

      # THE PACKAGED APP, STARTED THE WAY A PI ON A PEDALBOARD STARTS IT.
      #
      # "Start when this computer turns on" runs the app with --hidden, on a
      # Pi with no screen, and nobody is there to see it fail. So it is run
      # that way here, on a virtual screen (Xvfb), from the folder the .deb
      # and the AppImage are both made from — on both processors, which is
      # the only place the Pi's arm64 build is ever actually started by
      # anybody but a customer.
      #
      # WHEN IT CAN STOP ANYTHING. On a pull request, a red result here is
      # before anything is released. On a push to main or a tag it is not:
      # Package above has already published these files to the release by
      # the time this runs, so a failure there says the Linux build that just
      # went out is broken — worth knowing at once, but it kept nothing back.
      # What it proves:
      #
      #   - with --hidden it serves: the device server answers /healthz;
      #   - with --hidden it opens no window;
      #   - a second launch steps aside by itself, cleanly, and the server
      #     the first copy started is still answering after it (before the
      #     single-instance lock, a second copy on Linux stopped that server);
      #   - the first copy then opens its window, because it was asked to;
      #   - SIGTERM, which is what a proper shutdown sends, ends it promptly,
      #     and the device server goes with it.
      #
      # The folder is linux-unpacked on x64 and linux-arm64-unpacked on arm64
      # (electron-builder adds the processor's name when it is not x64), and
      # the binary is named after the package, the same file the .deb puts at
      # /opt/Fractal Remote/fractal-remote-desktop. --no-sandbox because
      # Chromium's sandbox helper is only usable once installed as root,
      # which an unpacked folder never is.
      #
      # It cannot update itself mid-test, but not because nobody is there to
      # type a password: this folder carries the .deb's update marker, and
      # sudo on a runner asks for none. It is because this build is never
      # older than the newest release — on a pull request it is the next
      # version, and on main it is the release just published — so there is
      # nothing newer to download, let alone install.
      #
      # Bounded twice: every wait in the script has its own limit (about six
      # minutes at the very worst), and the step's own timeout catches
      # anything that hangs in a way the script did not foresee, rather than
      # holding both runners until GitHub's six-hour limit.
      - name: The app starts with no window, once, and stops when told
        working-directory: desktop
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xwininfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb x11-utils
          fi
          app_dir="$(ls -d release/linux*-unpacked | head -n 1)"
          bin="$PWD/$app_dir/fractal-remote-desktop"
          [ -x "$bin" ] || { echo "no app at $bin"; ls -la "$app_dir"; exit 1; }
          echo "running $bin"

          cat > "$RUNNER_TEMP/hidden-start.sh" <<'SCRIPT'
          set -u
          bin="$1"
          log="$RUNNER_TEMP/first.log"
          healthy() { curl -fsS --max-time 2 http://localhost:5056/healthz >/dev/null 2>&1; }
          windows() { xwininfo -root -tree | grep -E '^[[:space:]]*0x[0-9a-f]+ "[^"]*Fractal Remote[^"]*":' || true; }
          fail() {
            echo "::error::$1"
            echo "---- the app said:"; cat "$log" || true
            [ -f "$RUNNER_TEMP/second.log" ] && { echo "---- the second launch said:"; cat "$RUNNER_TEMP/second.log"; }
            kill -KILL "$first" 2>/dev/null || true
            exit 1
          }

          "$bin" --no-sandbox --hidden >"$log" 2>&1 &
          first=$!

          up=0
          for _ in $(seq 1 90); do
            if healthy; then up=1; break; fi
            kill -0 "$first" 2>/dev/null || fail "the app quit before the device server answered"
            sleep 1
          done
          [ "$up" = 1 ] || fail "the device server did not answer /healthz within 90 seconds"
          echo "the device server answers"

          # Watched, not glanced at. The app decides about its window only
          # once its first look for updates is over, which asks GitHub and can
          # take longer than any fixed wait — so this watches for a window
          # every second until the app says its launch is done (or for 30
          # seconds, if it never says so), and one more look after that.
          for _ in $(seq 1 30); do
            [ -z "$(windows)" ] || { windows; fail "a start with --hidden opened a window"; }
            grep -q '\[launch\] done' "$log" && break
            sleep 1
          done
          grep -q '\[launch\] done' "$log" || echo "::warning::the app never said its launch was done; watched for a window for 30 seconds instead"
          sleep 1
          [ -z "$(windows)" ] || { windows; fail "a start with --hidden opened a window"; }
          echo "no window"

          # -k: a second copy stuck where SIGTERM cannot reach it is killed
          # five seconds later, rather than holding the step for ever.
          started=$(date +%s)
          timeout -k 5 30 "$bin" --no-sandbox >"$RUNNER_TEMP/second.log" 2>&1
          code=$?
          [ "$code" = 0 ] || fail "the second launch did not step aside cleanly within 30 seconds (exit $code)"
          echo "the second launch left by itself after $(( $(date +%s) - started ))s"
          kill -0 "$first" 2>/dev/null || fail "the second launch took the first copy down with it"
          healthy || fail "the device server stopped answering after a second launch"
          echo "the first copy and its server are still there"

          shown=0
          for _ in $(seq 1 20); do
            if [ -n "$(windows)" ]; then shown=1; break; fi
            sleep 1
          done
          [ "$shown" = 1 ] || fail "the second launch did not bring the first copy's window up"
          echo "the first copy opened its window"

          kill -TERM "$first"
          gone=0
          for _ in $(seq 1 15); do
            if ! kill -0 "$first" 2>/dev/null; then gone=1; break; fi
            sleep 1
          done
          [ "$gone" = 1 ] || fail "SIGTERM did not end the app within 15 seconds"
          echo "SIGTERM ended it"
          for _ in $(seq 1 10); do
            healthy || { echo "and the device server went with it"; cat "$log"; exit 0; }
            sleep 1
          done
          fail "the device server outlived the app"
          SCRIPT

          xvfb-run -a --server-args="-screen 0 1280x800x24" bash "$RUNNER_TEMP/hidden-start.sh" "$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: fractal-remote-linux-${{ matrix.arch }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          # The finished installers are on the Releases page; this copy is only for
          # fetching a build by hand, so it goes after three days instead of 90.
          retention-days: 3

  # ------------------------------------------------------------- complete
  #
  # A RELEASE IS NOT DONE BECAUSE FOUR JOBS WENT GREEN. It is done when the
  # files are on it, and twice in one evening those were different things.
  #
  # 1.14.0 lost the whole of Intel Linux to a race for the release itself.
  # 1.17.0 lost Windows to a network drop 120MB into downloading Electron.
  # Different causes, same shape: every other platform published normally, so
  # the release page looked finished, and the only way to find out was to go
  # looking. Nothing said a word.
  #
  # This says the word. It runs after the four builds, reads back what is
  # actually on the release, and fails with the missing names listed when
  # anything a person or an updater needs is not there.
  #
  # WHAT IT CHECKS, and what it deliberately does not. Installers and update
  # manifests, because those are what somebody downloads and what an installed
  # app reads to find the next version — a missing latest-linux.yml is silent
  # and permanent. Not blockmaps: they only make an update smaller, and a
  # release is still usable without one.
  complete:
    needs: [mac, windows, linux]
    # `always()` because this matters MOST when a build has failed: the run is
    # red either way, and this turns "something went wrong somewhere" into a
    # list of exactly which files are missing.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/desktop-v') || ((inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Every platform is really on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./desktop/package.json').version")"
          tag="v$v"

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > have.txt

          # One line per thing somebody downloads or an updater reads.
          cat > want.txt <<WANT
          Fractal-Remote-$v.dmg
          Fractal-Remote-$v-arm64.dmg
          Fractal-Remote-$v-mac.zip
          Fractal-Remote-$v-arm64-mac.zip
          latest-mac.yml
          Fractal-Remote-Setup-$v.exe
          latest.yml
          Fractal-Remote-$v.AppImage
          fractal-remote-desktop_${v}_amd64.deb
          latest-linux.yml
          Fractal-Remote-$v-arm64.AppImage
          fractal-remote-desktop_${v}_arm64.deb
          latest-linux-arm64.yml
          WANT
          sed -i 's/^[[:space:]]*//' want.txt

          missing=$(comm -23 <(sort want.txt) have.txt || true)
          echo "On $tag:"
          sed 's/^/  /' have.txt

          if [ -n "$missing" ]; then
            echo "::error::$tag is incomplete. A platform built but did not publish."
            echo "### $tag is missing files" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$missing" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run the failed job. If every job was green, the upload was" >> "$GITHUB_STEP_SUMMARY"
            echo "lost rather than the build." >> "$GITHUB_STEP_SUMMARY"
            echo "missing:"
            echo "$missing" | sed 's/^/  /'
            exit 1
          fi

          echo "All four platforms are on $tag."
          echo "### $tag is complete — all four platforms" >> "$GITHUB_STEP_SUMMARY"
