# Set up the iOS signing for every target, once, from here.
#
# The Apple Watch app (1.86.44) is a second target, and EAS will not attach the
# existing distribution certificate to it in a non-interactive build. This runs
# the interactive setup with every question answered by scripts/ios-credentials.py,
# and reaches Apple through the App Store Connect API key in the repository
# secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) — no Apple ID, password or
# phone code. Started by hand; it builds nothing and spends no build slot.
name: ios-credentials

on:
  workflow_dispatch:

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_SECRET }}

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      - name: The Apple key, as a file only this job can read
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc.p8" || { echo "::error::ASC_KEY_P8 is not a .p8 key"; exit 1; }

      - name: Set up the signing
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: 3KA9RC7YE6
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          pip install --quiet pexpect
          python3 scripts/ios-credentials.py

      - name: The key is gone
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
