# Check and build the phone apps.
#
# Two jobs, because they answer different questions and only one of them needs
# a secret.
#
# `check` runs on every pull request that touches the app and needs nothing at
# all. It bundles for both platforms with Metro, which is the only thing that
# catches the failures this app is actually prone to: an import Metro cannot
# resolve, a package the installed SDK does not match, a screen that references
# something that no longer exists. None of that shows up in `npm test`, and all
# of it shows up minutes into an EAS build otherwise — on a build machine, at
# the far end of a queue.
#
# `build` is started by hand and produces something installable. It needs
# EXPO_SECRET, an Expo access token with build permission, in the repository
# secrets. Without it the job says so and stops rather than failing halfway
# through with an authentication error that reads like a code problem.
#
# EXPO_SECRET rather than the conventional EXPO_TOKEN, and the reason is worth
# a line: that is what the secret is called. The name was written here first
# and the secret was created second, under a different one, and the job then
# reported no token for a token that was sitting right there. Renaming a GitHub
# secret means deleting it and making a new one, and an Expo access token is
# shown exactly once — so insisting on the convention would have cost a trip
# back to expo.dev for a fresh token to fix a spelling. The file bends instead.
#
# It is passed to expo-github-action's `token:` input, which puts it in the
# environment as EXPO_TOKEN for every step after it, so the EAS CLI sees the
# name it expects regardless.
#
# There is no push-to-main build on purpose. An iOS build consumes a queue slot
# and, on a paid plan, money; a native build on every merge would spend both on
# changes that never touch the phone.
name: mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to build'
        type: choice
        default: all
        options: [all, ios, android]
      profile:
        description: 'Which eas.json build profile'
        type: choice
        default: preview
        options: [preview, ios-simulator, production, development]
      submit:
        description: 'Send it to TestFlight, and to Google Play production (everyone), when it finishes'
        type: boolean
        default: false
      submit_only:
        description: 'Skip building; send the last build that succeeded'
        type: boolean
        default: false
      keep_packages:
        description: 'Build with the Expo packages as they are, even if Expo has newer patches (keeps this build on the same update line as the store copies before it)'
        type: boolean
        default: false
      next_store:
        description: 'Build the next store version: the native work waiting in docs/pending put in for this build only (main is left as it is, so the store copies keep their updates)'
        type: boolean
        default: false
      android_testing:
        description: "Send Android to Google Play's internal testing track (testers only), not production"
        type: boolean
        default: false
      store_version:
        description: 'The version number the stores show for this build, such as 2.0.0 (leave empty for the app''s own; the updates keep theirs either way)'
        type: string
        default: ''
      update:
        description: 'Publish a JS update instead of building (costs no build slot)'
        type: boolean
        default: false
      update_channel:
        description: 'Which channel the update goes to'
        type: choice
        default: both
        options: [both, production, preview]
  pull_request:
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'scripts/sync-relay-rules.mjs'
      - '.github/workflows/mobile.yml'
  # AND ON MAIN, WHICH PUBLISHES THE UPDATE AND NEVER BUILDS.
  #
  # "It's supposed to be doing updates, right? For small changes without
  # having to do any build?" That was the intent and the job existed, gated on
  # somebody opening this workflow and ticking a box — which nobody ever did,
  # so a handset sat on the version it was installed at while thirty changes
  # went past it.
  #
  # Safe because `build` is gated on the event being a workflow_dispatch, so a
  # push cannot reach it whatever else changes here. An iOS build slot is
  # still only ever spent by hand. Publishing a JS bundle costs nothing and is
  # the whole point of having the fingerprint pinned.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'scripts/sync-relay-rules.mjs'
      - '.github/workflows/mobile.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The suite that holds the two clients in agreement — the relay rules,
      # the project both ends sign into, how an empty slot reads.
      - run: npm ci
      - name: The repository checks, phone apps included
        run: npm test

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # Without the "newest patch of every Expo package" part, on purpose.
      #
      # That part compares mobile/package.json against whatever Expo published
      # most recently, so it goes red the day Expo ships a patch, with no change
      # here at all. It did: expo 57.0.26 and expo-updates 57.0.24 came out, this
      # step failed on the 1.86.17 merge, the update job behind it never ran,
      # and the phones sat on 1.86.16 with nothing saying so.
      #
      # And what it asks for is the one thing an update must never do: moving
      # expo-updates changes the fingerprint, and a changed fingerprint means no
      # update reaches any phone until a build is spent. So the version part
      # runs in the build job below, before a slot is spent, which is when
      # lining the packages up belongs. Everything else expo-doctor checks still
      # blocks here.
      - name: The config is one the installed SDK understands
        working-directory: mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: npx expo-doctor

      # WHETHER THIS CHANGE COSTS A BUILD, ANSWERED BEFORE IT MERGES.
      #
      # An update only reaches a build whose fingerprint matches it. Move
      # anything native and every phone already carrying this app stops
      # receiving updates — silently, with no error, until somebody spends a
      # build. On iOS that is a handful a month, and when they run out
      # development stops until the month turns over.
      #
      # It has happened. Three native changes landed after the last build and
      # nothing said so; an update was published, reported as published, and
      # could never have reached anything. This is that check, done by a
      # machine on every pull request instead of by somebody remembering.
      #
      # It runs here because this job has already installed the app's own
      # dependencies, and the fingerprint hashes those rather than just the
      # config — so it costs seconds rather than another install.
      - name: This change still ships as an update, not a build
        run: npm run fingerprint

      # Both platforms, because they resolve differently: a module with a
      # `.ios.js` variant, or a native package missing on one side, bundles on
      # one and not the other.
      - name: It bundles for iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/bundle-ios

      - name: It bundles for Android
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/bundle-android

  build:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.update }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 here and everywhere else in this repository, which it was not
      # always. This job ran ahead of the rest on 22 for a while, and the
      # reason is worth keeping because it is what eventually moved the whole
      # repository.
      #
      # eas-cli 24.6.0 will not install on Node 20 — one of its dependencies
      # refuses outright:
      #
      #   error @oclif/plugin-autocomplete@3.3.0: The engine "node" is
      #   incompatible with this module. Expected version ">=22.0.0".
      #   Got "20.20.2"
      #
      # That was one of the two triggers the repository had been watching for,
      # and it fired: something needed would not install on Node 20. This job
      # went to 22 alone because it compiles no native module and never runs
      # the unit — it installs a CLI and hands a directory to Expo's build
      # servers.
      #
      # The rest followed in 7.334.0, once the fear the watching brief was
      # written around had been measured rather than assumed. See CLAUDE.md:
      # serialport and @julusian/midi both declare N-API, which is ABI-stable
      # on purpose, and desktop.yml already proves they load under Electron on
      # every build.
      #
      # The Node the packaged Mac app runs is still NOT this one. That comes
      # from whatever Electron bundles, and Electron 33 bundles Node 20.18.
      # Moving it is a separate change with a hardware check at the end.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Never reads the `secrets` context as a whole, and that is the point.
      #
      # This step briefly did, to list the secret names when the token came
      # back empty — the idea being that a typo, the Variables tab, an
      # environment secret and the wrong repository all look identical from
      # here, and the names would tell them apart. It worked exactly as well as
      # a credential dump: serialising the whole secrets context is a
      # documented exfiltration technique, and every run of this workflow was
      # held at action_required from the moment it landed — the one triggered
      # by hand from the Actions tab included. web.yml on the same commit ran
      # untouched, which is what pinned it to this file.
      #
      # The names are not worth that. A person looking at the repository's
      # Secrets page reads them in one glance, with nothing written to a log
      # that anyone with read access can then fetch. So the step asks its one
      # question, says where to go, and touches nothing else.
      - name: There is a token to build with
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_SECRET }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::No EXPO_SECRET secret. Add an Expo access token with build permission at Settings › Secrets and variables › Actions, on the Secrets tab, named exactly EXPO_SECRET. Check the name against that page: Variables is a separate tab, and an environment secret is not a repository secret."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_SECRET }}

      # THE NEXT STORE VERSION, BUILT WITHOUT TAKING THE STORE COPIES' UPDATES
      # AWAY. "Can you do the iphone and android builds as version 2.0, but
      # leave the over the air updates at the intervals we are doing now? I
      # want to test it all on test flight first before a public release but
      # i still want OTA updates going out in the meantime." (Justin, 16
      # November 2026.) Merging docs/pending's native work into main would
      # move main's fingerprint, and from that merge on no update would reach
      # a copy in the stores until its owner installed the new one. So the
      # patches go into this build's checkout only (scripts/apply-pending.sh,
      # the README's order), main keeps the store copies' fingerprint and
      # every merge still reaches them, and the update job publishes each
      # update a second time, with the same patches, for this build's testers
      # (docs/pending/next-store.json). Before Install, because a patch may
      # bring a package and its lock.
      #
      # Google Play's internal testing track is one of those patches
      # (play-internal: eas.json is in the fingerprint, so its `testing`
      # submit profile could not go into main without stopping every
      # update), so that box wants this one: on a build, ticked as well; on
      # a submission, the patches come in for the profile and nothing is
      # built from them.
      - name: The internal testing track is for the next store version
        if: ${{ inputs.android_testing && !inputs.next_store && !inputs.submit_only }}
        run: |
          echo "::error::Google Play's internal testing track is for the next store version: tick Build the next store version as well."
          exit 1

      # AND THE OTHER WAY ROUND: a next store version is for testers until
      # Justin says. "I want to test it all on test flight first before a
      # public release" (16 November 2026). Without this, Build the next store
      # version (or a store version number) with Send ticked and the testing
      # box left alone sends Android with plain --auto-submit, so by the
      # `production` submit profile to Google Play production, everyone; and
      # a Skip building resend without the box sends the newest Android
      # build, which is the testers' one while docs/pending/next-store.json
      # is there, to the same place (an independent read, before the 2.0.0
      # pair). The iPhone's only way is TestFlight, which is testers, so an
      # iPhone run is left alone. On release day there is no new build to
      # send: Promote release in Play Console.
      - name: A next store version goes to testers, never to everyone
        if: >-
          ${{ inputs.platform != 'ios' && !inputs.android_testing && (
          (inputs.submit && !inputs.submit_only && (inputs.next_store || inputs.store_version != '')) ||
          (inputs.submit_only && hashFiles('docs/pending/next-store.json') != '')
          ) }}
        run: |
          echo "::error::A next store version goes to Google Play's internal testing track until it is released: tick Send Android to Google Play's internal testing track (or untick Send)."
          exit 1

      - name: The next store version's native work, for this build only
        if: ${{ inputs.next_store || inputs.android_testing }}
        run: bash scripts/apply-pending.sh

      # AND ITS NUMBER, in this build's copy only. "dont change the build
      # number to 2.0.0 on the updartes currently going. only after we do the
      # native builds" (Justin, 16 November 2026.) mobile/app.json's version
      # is what App Store Connect, TestFlight, Google Play and the copy's own
      # installedStoreVersion() read; it is written here on the runner and
      # never committed, so main and every update keep their own number. Left
      # out of the fingerprint, so it changes nothing about which updates the
      # build takes. scripts/store-version.mjs refuses anything that is not
      # three numbers, or is below what a store already has, and then nothing
      # is built. Read through env, never pasted into the script.
      - name: The version number the stores show, for this build only
        if: ${{ inputs.store_version != '' && !inputs.submit_only }}
        env:
          STORE_VERSION: ${{ inputs.store_version }}
        run: node scripts/store-version.mjs "$STORE_VERSION"

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # The full check, package versions included, before a build slot is
      # spent. See the same step in `check` for why only here.
      #
      # Unless "keep_packages" is ticked. Lining the packages up to Expo's
      # newest patches moves expo-updates, so the fingerprint, so the build
      # gets an update line of its own: every merge after it reaches only
      # copies of this build, and the store copies before it (the App Store's
      # 1.89.3 and Google Play's 1.89.36 on 8 November 2026) take no fix at
      # all until their owners install the new one, which on an iPhone waits
      # on Apple's review and release. The 1.90.0 pair (8 November 2026) was
      # the first build Expo's patches stopped: expo 57.0.31 against 57.0.32,
      # expo-updates 57.0.26 against 57.0.27, and five more, all patches. It
      # was built with the packages as they were tested and bundled, and the
      # fingerprint unchanged, so every copy kept one update line. Ticked, the
      # rest of expo-doctor still blocks, and what Expo would line up is left
      # in the log, for the build that does line them up.
      - name: The packages are the ones this SDK expects
        if: ${{ !inputs.keep_packages }}
        working-directory: mobile
        run: npx expo-doctor

      - name: The config is one the installed SDK understands (packages kept as they are)
        if: ${{ inputs.keep_packages }}
        working-directory: mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: |
          npx expo-doctor
          echo "::notice::Built with the Expo packages as they are (keep_packages). Expo's newer patches, left for a later build:"
          npx expo install --check || true

      # The app has to exist on Expo's side before anything can be built for
      # it, and until now it never has: app.json carried an empty `extra.eas`,
      # so there was no project id and `eas build --non-interactive` has
      # nothing to attach a build to.
      #
      # `eas init` is what creates it, and it is safe to run every time: with
      # the owner and slug set in app.json it finds the existing project on
      # every run after the first and writes the same id back. Nothing is
      # created twice.
      #
      # The id it writes lands in the runner's copy of app.json and is thrown
      # away with the runner. That is untidy but not wrong — the owner and the
      # slug are what identify the project, and they are committed. Pinning the
      # id in app.json once it is known would save this call; it is not worth a
      # round trip to find out.
      - name: The app is registered with Expo
        working-directory: mobile
        run: eas init --non-interactive --force

      # Non-interactive and queued rather than waited on: an iOS build can sit
      # in a queue longer than a job is allowed to run, and a workflow that
      # times out waiting looks like a build that failed.
      # The Apple login this repository already has.
      #
      # An iOS build needs a Distribution Certificate, and Expo will not
      # conjure one on its own:
      #
      #   Distribution Certificate is not validated for non-interactive builds.
      #   Credentials are not set up. Run this command again in interactive mode.
      #
      # Creating one means asking Apple, and asking Apple means logging in.
      # These two secrets are that login, and they have been in this repository
      # for weeks doing the Mac app's notarising in desktop.yml — the same
      # Apple ID, the same app-specific password. Nothing new was needed; they
      # were simply never handed to this job.
      #
      # EXPO_APPLE_ID and EXPO_APPLE_APP_SPECIFIC_PASSWORD are the names the
      # EAS CLI looks for. An app-specific password rather than the account
      # password is the whole point: it carries no two-factor prompt, which is
      # what a build server cannot answer.
      # Building and shipping are two different things, and the gap between
      # them is easy to miss: `eas build` produces a file on Expo's servers
      # and stops there. Nothing reaches TestFlight, so nothing is installable
      # on a phone, and the build page looks finished while the phone stays
      # empty.
      #
      # `--auto-submit` closes that gap without waiting: the build is queued
      # with `--no-wait` because an iOS build can outlast a job, and the
      # submission is queued behind it on Expo's side rather than here. It
      # needs the App Store Connect API key, which is on the project now, and
      # eas.json's submit block already names the team.
      #
      # Off by default. A submission is outward-facing — it puts a build in
      # front of Apple's review tooling and every TestFlight tester — so it is
      # asked for by ticking the box, not a side effect of building.
      #
      # AND ON ANDROID IT IS THE PUBLIC. "I don't do any close testing
      # anymore. Android. It's all production now." eas.json sends Android to
      # Play's production track, not the closed-testing one ("alpha") it used
      # to: once Google's review passes, the build rolls out to every Play
      # customer. iOS is unchanged — TestFlight first, and the App Store only
      # after Justin sends that build for review in App Store Connect.

      # Sends the build that already exists, rather than making another.
      #
      # A submission can fail on its own — a missing App Store Connect app id,
      # a name Apple would not accept — while the build it was carrying is
      # perfectly good and sitting on Expo's servers. Rebuilding to retry the
      # submission costs twenty-five minutes to produce a byte-identical
      # artefact, and burns a build slot doing it.
      #
      # `--latest` is the newest finished build for the platform, which is
      # exactly the one the failed submission was for.
      #
      # "Send Android to Google Play's internal testing track" picks the
      # `testing` submit profile (docs/pending/play-internal.patch, put in
      # above) in place of `production`: the iPhone the same
      # (TestFlight, never the App Store without Justin's own submission),
      # Android to Play's internal testing track, so nothing is public. A
      # build there is put in production later with Promote release in Play
      # Console, no new build.
      - name: Send the last build
        if: ${{ inputs.submit_only }}
        working-directory: mobile
        run: |
          eas submit \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.android_testing && 'testing' || inputs.profile }}" \
            --latest \
            --non-interactive

      # The team, said rather than asked. A second target (the Apple Watch app)
      # needs a provisioning profile of its own, so EAS signs in to Apple with
      # the project's App Store Connect key to make it — and that sign-in asked
      # "Apple Team ID:" on a job that cannot answer:
      #
      #   Failed to authenticate with the App Store Connect API key from EAS
      #   credentials service: Input is required, but stdin is not readable.
      #
      # It is the team already in eas.json's submit block and app.json.
      # And the App Store Connect API key (ASC_* secrets), so a provisioning
      # profile that needs remaking — a new target, an expired one — is remade
      # here rather than stopping the build. See ios-credentials.yml for the
      # one-time setup it cannot do on its own.
      - name: The Apple key, as a file only this job can read
        if: ${{ !inputs.submit_only && inputs.platform != 'android' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            umask 077
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: ${{ !inputs.submit_only }}
        working-directory: mobile
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          EXPO_APPLE_TEAM_ID: 3KA9RC7YE6
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait \
            ${{ inputs.submit && (inputs.android_testing && '--auto-submit-with-profile=testing' || '--auto-submit') || '' }}

  # ---------------------------------------------------------------- updating
  #
  # PUBLISHING A JS UPDATE, WHICH COSTS NOTHING.
  #
  # This existed nowhere until now, which was a real gap rather than an
  # oversight worth shrugging at: every change since the last build has been
  # JavaScript, and there was no way to get any of it onto a phone short of
  # spending one of a handful of iOS build slots. `eas update` sends the
  # bundle to Expo and the installed app picks it up on its next launch.
  #
  # WHY IT CANNOT SHIP THE WRONG THING TO THE WRONG BUILD. app.json sets
  # `runtimeVersion.policy` to `fingerprint`: Expo hashes everything native —
  # the config, the native dependency graph, the autolinked modules — and an
  # update only reaches a build whose fingerprint matches. Change a native
  # dependency and the hash moves, and older builds simply never see it rather
  # than downloading something they cannot run. So this is safe to run on a
  # whim in a way that a build is not.
  #
  # BOTH CHANNELS BY DEFAULT, because which one an installed app listens to is
  # decided by the profile it was built with — `production` for anything that
  # went to TestFlight, `preview` for anything installed directly — and the
  # person asking for an update should not have to remember which. The same
  # bundle going to both is harmless; a bundle going to the one channel the
  # phone in your hand is not on is a confusing half hour.
  update:
    # By hand with the box ticked, or on every change that lands on main.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.update) || github.event_name == 'push' }}
    # Never ahead of the checks. `check` bundles both platforms and proves the
    # generated copies are current, and a bundle that does not build is a
    # bundle no phone should be asked to run — least of all one published
    # without anybody watching. It runs on every trigger, so this holds for a
    # dispatch as well, and `needs` takes a name rather than an expression.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The same one question the build job asks, for the same reason, and
      # deliberately without reading the `secrets` context as a whole — see
      # the long note on that step above.
      - name: There is a token to publish with
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_SECRET }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::No EXPO_SECRET secret. Add an Expo access token at Settings › Secrets and variables › Actions, on the Secrets tab, named exactly EXPO_SECRET."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_SECRET }}

      # The generated copies the phone carries are built from shared/ at the
      # repository root, so the root install happens too. An update that
      # shipped a stale copy of the relay rules would be the exact drift
      # sync:rules exists to stop, published straight to a handset.
      - name: Install, and prove the generated copies are current
        run: |
          npm ci
          npm run sync:rules
          git diff --exit-code -- mobile/src/lib mobile/app.json \
            || { echo "::error::A generated copy under mobile/ is stale. Run npm run sync:rules and commit it."; exit 1; }

      - name: Install the app's own dependencies
        working-directory: mobile
        run: npm ci

      # Branch rather than channel. A channel points at a branch, and every
      # channel here was created by a build with the same name as its branch,
      # so naming the branch reaches the same place and works on every version
      # of the CLI rather than only the ones that accept `--channel`.
      - name: Publish
        working-directory: mobile
        run: |
          set -euo pipefail
          want="${{ inputs.update_channel || 'both' }}"
          [ "$want" = "both" ] && targets="production preview" || targets="$want"
          for branch in $targets; do
            echo "── $branch ──"
            eas update \
              --branch "$branch" \
              --message "${GITHUB_REF_NAME}@$(git rev-parse --short HEAD): $(git log -1 --pretty=%s | cut -c1-80)" \
              --non-interactive
          done

      # AND A SECOND TIME FOR THE NEXT STORE VERSION'S TESTERS, while one is
      # out (docs/pending/next-store.json, written in the pull request after
      # its build was started, with the fingerprints that build carries).
      # Main's own update has gone first, above, so the store copies have
      # theirs whatever happens here. The same patches as the build, in the
      # same order (scripts/apply-pending.sh), so the same fingerprint, and
      # the production branch only: a store build listens on production.
      # scripts/next-store.mjs says, before publishing, whether what is about
      # to go out still matches the build the testers have; a patch changed
      # since that build means they take no update until another build.
      - name: Publish for the next store version's testers
        if: ${{ hashFiles('docs/pending/next-store.json') != '' && (inputs.update_channel || 'both') != 'preview' }}
        run: |
          set -euo pipefail
          bash scripts/apply-pending.sh
          (cd mobile && npm ci)
          check=0
          node scripts/next-store.mjs || check=$?
          if [ "$check" -ne 0 ] && [ "$check" -ne 3 ]; then exit "$check"; fi
          # A build of one phone alone (next-store.json "only") gets its
          # update for that phone alone: the other phone's fingerprint with
          # the patches in is the store copies' own.
          only="$(node -p "require('./docs/pending/next-store.json').only || 'all'")"
          case "$only" in ios|android|all) ;; *) echo "::error::docs/pending/next-store.json has an only that is not ios or android"; exit 1 ;; esac
          cd mobile
          eas update \
            --branch production \
            --platform "$only" \
            --message "next store version, ${GITHUB_REF_NAME}@$(git rev-parse --short HEAD): $(git log -1 --pretty=%s | cut -c1-60)" \
            --non-interactive
          if [ "$check" -eq 3 ]; then
            echo "::error::Published, but with docs/pending in this is not what the next store version's build carries, so its testers take no update until another build. The lines above say which part moved."
            exit 1
          fi

      - name: What was published
        run: |
          echo "Published to: ${{ inputs.update_channel || 'both' }}"
          echo "An installed app picks this up on its next launch, if its fingerprint matches the build."
