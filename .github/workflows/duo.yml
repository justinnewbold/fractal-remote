# Open the next build on Apple's newest software, for free, before an EAS
# build slot is spent on it.
#
# The build pair made from main after the iPhone Duo work is made with Xcode
# 27.1 (mobile/eas.json pins macos-tahoe-26.6-xcode-27.1): only an app built
# with the iOS 27.1 SDK fills the Duo's screens. That SDK also refuses to
# launch an app without the scene life cycle (Apple TN3187), which
# expo-build-properties' ios.enableSceneSupport turns on. A compile proves
# neither: an app with no scene support compiles and is killed at launch. So
# this builds the iPhone app the way EAS does, with Xcode 27.1, opens it on
# the newest iOS simulator, and checks it is still running a while later,
# with a picture of the first screen kept as the "duo-screens" artifact. An
# iPhone Duo simulator is used when the image has one.
#
# By hand only (Actions → duo → Run workflow on the branch): the runner
# image is a public preview, and a label no runner answers would leave a
# pull request waiting on a check that never starts.
name: duo

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The image defaults to Xcode 27.0, which does not fill the Duo.
      - name: Xcode 27.1
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: The iPhone project, as EAS makes it
        working-directory: mobile
        run: npx expo prebuild -p ios --no-install

      - name: Scene support is in it
        working-directory: mobile/ios
        run: |
          grep -q UIApplicationSceneManifest FractalRemote/Info.plist
          grep -q EXExpoAppSceneDelegate FractalRemote/Info.plist

      - name: Pods
        working-directory: mobile/ios
        run: pod install

      - name: The app builds with Xcode 27.1
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FractalRemote.xcworkspace -scheme FractalRemote \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -B2 -A12 -E 'error:|error |failed with exit' build.log | head -n 200; exit 1; }
          tail -n 20 build.log

      # Opened, then asked again 30 seconds later whether it is still running:
      # an app the scene rule refuses is gone by then.
      - name: It opens, and stays open
        working-directory: mobile/ios
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 2 -name 'FractalRemote.app' -path '*iphonesimulator*' | head -n 1)
          test -n "$APP"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; print(sorted(r, key=lambda x: [int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          TYPES=$(xcrun simctl list devicetypes -j)
          DUO=$(echo "$TYPES" | python3 -c "import json,sys; t=[x for x in json.load(sys.stdin)['devicetypes'] if 'Duo' in x['name']]; print(t[0]['identifier'] if t else '')")
          PHONE=$(echo "$TYPES" | python3 -c "import json,sys; t=[x for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPhone') and 'Duo' not in x['name']]; print(t[-1]['identifier'])")
          mkdir -p screens
          for TYPE in $DUO $PHONE; do
            echo "== $TYPE on $RUNTIME"
            UDID=$(xcrun simctl create "check" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" cloud.newbold.fractalremote
            sleep 30
            NAME=$(echo "$TYPE" | sed 's/.*SimDeviceType\.//')
            xcrun simctl io "$UDID" screenshot "screens/$NAME.png"
            xcrun simctl spawn "$UDID" launchctl list | grep -q 'cloud.newbold.fractalremote' \
              || { echo "The app is not running 30 seconds after it was opened on $NAME."; exit 1; }
            xcrun simctl shutdown "$UDID"
            xcrun simctl delete "$UDID"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-screens
          path: mobile/ios/screens
          if-no-files-found: ignore
          retention-days: 7
