# Open the next build on Apple's newest software, for free, before an EAS
# build slot is spent on it.
#
# The build pair made from main after the iPhone Duo work is made with Xcode
# 27.1 (mobile/eas.json pins macos-tahoe-26.6-xcode-27.1): only an app built
# with the iOS 27.1 SDK fills the Duo's screens. That SDK also refuses to
# launch an app without the scene life cycle (Apple TN3187), which
# expo-build-properties' ios.enableSceneSupport turns on. A compile proves
# neither: an app with no scene support compiles and is killed at launch. So
# this builds the iPhone app the way EAS does, with Xcode 27.1, opens it on
# the newest iOS simulator, and checks it is still running a while later,
# with a picture of the first screen kept as the "duo-screens" artifact. An
# iPhone Duo simulator is used when the image has one.
#
# And the Siri phrases (mobile/targets/watch/_shared/SiriShortcuts.swift),
# which are first compiled for the store on this Xcode. Apple reads App
# Intents only from what Xcode extracts at build time into the app's own
# Metadata.appintents folder, so the built app is checked for that folder and
# for all nine commands in it: a phrase file left out of the app target, or
# extracted by nobody, compiles cleanly and gives Siri nothing to hear. Then a
# fractalremote://scene/3 link is opened on the running app, the way a
# shortcut's Open URLs step does: with the scene life cycle on, a link reaches
# the app through Expo's scene delegate, which nothing else here exercises,
# and the app must still be running after it.
#
# And the fold sensor (mobile/modules/fractal-fold), whose iOS 27.1 code sits
# behind a guard on UIKit's version that no page of Apple's confirms: a wrong
# number compiles it out of the build without a word, and the build would
# ship a sensor that always answers nothing. Launched with -FractalFoldCheck,
# the app writes "FractalFold check:" lines to its standard error, which
# simctl puts in a file here, and the run fails unless they say compiledIn=true
# and, on iOS 27.1, that the sensor read the app's window.
#
# By hand only (Actions → duo → Run workflow on the branch): the runner
# image is a public preview, and a label no runner answers would leave a
# pull request waiting on a check that never starts.
#
# It is kept on main so that it can be started at all: GitHub offers Run
# workflow only for a workflow the default branch has. Until the build pull
# request lands, main has none of the three (the Xcode 27.1 pin, scene
# support, the Siri phrases) and stops at the first; it is run on the branch
# that carries the build work.
name: duo

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The image defaults to Xcode 27.0, which does not fill the Duo.
      - name: Xcode 27.1
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: The iPhone project, as EAS makes it
        working-directory: mobile
        run: npx expo prebuild -p ios --no-install

      - name: Scene support is in it
        working-directory: mobile/ios
        run: |
          grep -q UIApplicationSceneManifest FractalRemote/Info.plist
          grep -q EXExpoAppSceneDelegate FractalRemote/Info.plist

      - name: Pods
        working-directory: mobile/ios
        run: pod install

      - name: The app builds with Xcode 27.1
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FractalRemote.xcworkspace -scheme FractalRemote \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -B2 -A12 -E 'error:|error |failed with exit' build.log | head -n 200; exit 1; }
          tail -n 20 build.log

      # The phrase list Xcode extracted, with every command in it.
      - name: The Siri phrases are in the app
        working-directory: mobile/ios
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 2 -name 'FractalRemote.app' -path '*iphonesimulator*' | head -n 1)
          test -n "$APP"
          test -d "$APP/Metadata.appintents" \
            || { echo "FractalRemote.app has no Metadata.appintents: Siri would have no phrases."; exit 1; }
          ls -la "$APP/Metadata.appintents"
          for INTENT in GoToSceneIntent NextSongIntent PreviousSongIntent TunerOnIntent TunerOffIntent SetTempoIntent LoadPresetIntent PedalOnIntent PedalOffIntent; do
            grep -rqa "$INTENT" "$APP/Metadata.appintents" \
              || { echo "$INTENT is not in Metadata.appintents."; exit 1; }
          done
          # The phrases themselves: "Close the tuner in" is in a phrase and in no title.
          grep -rqa 'Close the tuner in' "$APP/Metadata.appintents" \
            || { echo "The Siri phrases are not in Metadata.appintents."; exit 1; }

      # Opened, then asked again 30 seconds later whether it is still running:
      # an app the scene rule refuses is gone by then.
      # Which simulators to open it on: the newest iOS the image has, and of
      # the iPhones THAT iOS says it supports, an iPhone Duo if there is one
      # and the newest other iPhone. A device type the runtime does not
      # support is refused by simctl create (exit 22, its "invalid argument"),
      # which is how the first run on this image stopped. What was picked is
      # written as a notice, so the run says it without its log.
      - name: Pick the simulators
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          ios = [r for r in runtimes if r.get('platform') == 'iOS' and r.get('isAvailable')]
          ios.sort(key=lambda r: [int(p) for p in r['version'].split('.')])
          print('::notice::iOS runtimes on this image: ' + ', '.join(r['name'] for r in ios), file=__import__('sys').stderr)
          runtime = ios[-1]
          supported = runtime.get('supportedDeviceTypes') or json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          duo = [d for d in supported if 'Duo' in d['name']]
          phones = [d for d in supported if d['name'].startswith('iPhone') and 'Duo' not in d['name']]
          if not phones:
              raise SystemExit('::error::' + runtime['name'] + ' supports no iPhone simulator')
          print('RUNTIME=' + runtime['identifier'])
          print('DUO=' + (duo[0]['identifier'] if duo else ''))
          print('PHONE=' + phones[-1]['identifier'])
          print('::notice::Picked ' + runtime['name'] + ', ' + (duo[0]['name'] if duo else 'no iPhone Duo') + ' and ' + phones[-1]['name'], file=__import__('sys').stderr)
          PY

      - name: It opens, and stays open
        working-directory: mobile/ios
        run: |
          set -eE
          # Whatever fails says so where the run's summary shows it.
          trap 'c=$?; echo "::error::$BASH_COMMAND failed with exit code $c"' ERR
          APP=$(find build/Build/Products -maxdepth 2 -name 'FractalRemote.app' -path '*iphonesimulator*' | head -n 1)
          test -n "$APP"
          mkdir -p screens
          for TYPE in $DUO $PHONE; do
            echo "== $TYPE on $RUNTIME"
            UDID=$(xcrun simctl create "check" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" cloud.newbold.fractalremote
            sleep 30
            NAME=$(echo "$TYPE" | sed 's/.*SimDeviceType\.//')
            xcrun simctl io "$UDID" screenshot "screens/$NAME.png"
            xcrun simctl spawn "$UDID" launchctl list | grep -q 'cloud.newbold.fractalremote' \
              || { echo "The app is not running 30 seconds after it was opened on $NAME."; exit 1; }
            # A link, as a shortcut's Open URLs step sends it, through the scene delegate.
            xcrun simctl openurl "$UDID" fractalremote://scene/3
            sleep 10
            xcrun simctl io "$UDID" screenshot "screens/$NAME-link.png"
            xcrun simctl spawn "$UDID" launchctl list | grep -q 'cloud.newbold.fractalremote' \
              || { echo "The app is not running 10 seconds after fractalremote://scene/3 was opened on $NAME."; exit 1; }
            xcrun simctl shutdown "$UDID"
            xcrun simctl delete "$UDID"
          done

      # The fold sensor is in the build, and reads the window once the app is
      # up. Launched with -FractalFoldCheck, and only then, the module writes
      # "FractalFold check:" lines to the app's standard error. simctl's
      # --stderr puts them in a file on the runner, written as they happen,
      # with nothing to filter, redact or wait for. The same lines go to the
      # system log, which is read too, for the case the file stays empty.
      - name: The fold sensor is compiled in
        working-directory: mobile/ios
        run: |
          set -eE
          trap 'c=$?; echo "::error::$BASH_COMMAND failed with exit code $c"' ERR
          APP=$(find build/Build/Products -maxdepth 2 -name 'FractalRemote.app' -path '*iphonesimulator*' | head -n 1)
          test -n "$APP"
          TYPE=${DUO:-$PHONE}
          mkdir -p screens
          OUT="$PWD/screens/fold-check.txt"
          echo "== $TYPE on $RUNTIME"
          UDID=$(xcrun simctl create "fold" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --stderr="$OUT" "$UDID" cloud.newbold.fractalremote -FractalFoldCheck YES
          sleep 20
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'eventMessage CONTAINS "FractalFold check:"' > screens/fold-check-log.txt 2>&1 || true
          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
          LINES=$(grep -ho 'FractalFold check: .*' "$OUT" 2>/dev/null || true)
          if [ -z "$LINES" ]; then
            echo "Nothing in the app's standard error; the system log instead."
            LINES=$(grep -ho 'FractalFold check: .*' screens/fold-check-log.txt 2>/dev/null || true)
          fi
          echo "$LINES"
          echo "$LINES" | grep -q 'FractalFold check: compiledIn=true' \
            || { echo "The fold sensor is not compiled in: the canImport(UIKit, _version:) number in FractalFoldModule.swift does not match the iOS 27.1 SDK, or the module did not start."; exit 1; }
          if echo "$LINES" | grep -q 'available=true'; then
            echo "$LINES" | grep -q 'FractalFold check: reading .*"window":{' \
              || { echo "The fold sensor is in the build but never read the app's window."; exit 1; }
          else
            echo "::warning::The simulator's iOS is older than 27.1, so the fold sensor was not seen running."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-screens
          path: mobile/ios/screens
          if-no-files-found: ignore
          retention-days: 7
