plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'cloud.newbold.fractalremote'
version = '1.0.0'

android {
  namespace "cloud.newbold.fractalremote.blemidi"
  // Expo's module plugin reads these and refuses to configure the module
  // without them ("'android.defaultConfig.versionName' is not defined").
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
